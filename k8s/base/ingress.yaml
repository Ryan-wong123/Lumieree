apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lumieree
  annotations:
    # Assumes ingress-nginx + cert-manager; adapt for your controller.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [lumieree.example.com]
      secretName: lumieree-tls
  rules:
    - host: lumieree.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lumieree-web
                port:
                  name: http
