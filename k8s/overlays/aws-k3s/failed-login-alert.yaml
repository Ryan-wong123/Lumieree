# E-mail alert for brute-force attempts: every 5 minutes, count failed sign-ins (password or second factor) in the
# audit log; if there are at least ALERT_THRESHOLD in the last ALERT_WINDOW_MINUTES, publish a message to the SNS topic
# `lumieree-alerts` (the same topic that carries the uptime alarm; its e-mail subscription must be confirmed).
# Needs: Secret `postgres-credentials`, and the instance role to allow sns:Publish on the topic (docs/deployment.md §16.6).
# Like the backup pod, it reaches the instance role through the metadata service; see networkpolicy-extra.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lumieree-alert
data:
  ALERT_TOPIC_ARN: arn:aws:sns:us-east-1:388033185694:lumieree-alerts
  ALERT_REGION: us-east-1
  ALERT_WINDOW_MINUTES: "5"
  ALERT_THRESHOLD: "5"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: failed-login-alert
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            app.kubernetes.io/component: alert
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: count
              image: postgres:16-alpine
              envFrom:
                - configMapRef:
                    name: lumieree-alert
              env:
                - {name: PGHOST, value: postgres}
                - {name: PGUSER, value: lumieree}
                - {name: PGDATABASE, value: lumieree}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}
              command:
                - sh
                - -ec
                - |
                  where="action in ('auth.login_failed','auth.mfa_failed') and created_at > now() - make_interval(mins => ${ALERT_WINDOW_MINUTES})"
                  n=$(psql -tAc "select count(*) from audit_log where $where")
                  echo "$n" > /out/count
                  {
                    echo "$n failed sign-in attempts in the last ${ALERT_WINDOW_MINUTES} minutes (alert threshold: ${ALERT_THRESHOLD})."
                    echo
                    echo "Top sources (address, attempts):"
                    psql -tAF ' ' -c "select coalesce(ip,'unknown'), count(*) from audit_log where $where group by 1 order by 2 desc limit 5"
                    echo
                    echo "Review the events in the app under Audit Log (filter: auth)."
                  } > /out/message.txt
              resources:
                requests: {cpu: 20m, memory: 32Mi}
                limits: {cpu: 200m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - {name: out, mountPath: /out}
          containers:
            - name: notify
              image: amazon/aws-cli:2.17.40
              envFrom:
                - configMapRef:
                    name: lumieree-alert
              env:
                - {name: HOME, value: /tmp}
              command:
                - sh
                - -ec
                - |
                  n=$(cat /out/count)
                  if [ "$n" -ge "$ALERT_THRESHOLD" ]; then
                    aws sns publish --region "$ALERT_REGION" --topic-arn "$ALERT_TOPIC_ARN" \
                      --subject "Lumieree security alert: failed sign-ins" --message file:///out/message.txt \
                      --query MessageId --output text
                    echo "alert sent ($n failures)"
                  else
                    echo "$n failures in the window: below the threshold, no alert"
                  fi
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {cpu: 200m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - {name: out, mountPath: /out, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: out
              emptyDir: {sizeLimit: 16Mi}
            - name: tmp
              emptyDir: {}
