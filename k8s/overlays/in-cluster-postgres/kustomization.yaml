# Self-contained deployment: app + PostgreSQL StatefulSet + nightly backups, all in one namespace.
# Prefer a managed PostgreSQL service for production; use this for small / single-cluster installs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lumieree
resources:
  - ../../base
  - postgres.yaml
  - postgres-backup.yaml
