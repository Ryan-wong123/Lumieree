# Nightly logical backup (pg_dump, custom format) kept on its own PVC, 14 newest files retained.
# Copy the dumps off-cluster (object storage) for real disaster recovery.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: "17 18 * * *"          # 02:17 Singapore time
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: postgres:16-alpine
              env:
                - {name: PGHOST, value: postgres}
                - {name: PGUSER, value: lumieree}
                - {name: PGDATABASE, value: lumieree}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}
              command:
                - sh
                - -ec
                - |
                  f=/backups/lumieree-$(date +%Y%m%d-%H%M%S).dump
                  pg_dump --format=custom --file="$f"
                  ls -1t /backups/lumieree-*.dump | tail -n +15 | xargs -r rm --
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - {name: backups, mountPath: /backups}
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
