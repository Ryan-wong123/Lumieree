{% extends "layout.html" %}
{% block content %}
<h4>{{ t('account_settings') }}</h4>
<form method="POST" style="max-width:520px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-2"><strong>{{ t('username') }}:</strong> {{ current_user.username }}</div>

  <label class="form-label">{{ t('email') }}</label>
  <input name="new_email" type="email" class="form-control mb-2" placeholder="{{ current_user.email or '' }}" autocomplete="email">

  <label class="form-label">{{ t('new_password') }}</label>
  <input name="new_password" type="password" class="form-control mb-1" autocomplete="new-password" minlength="12">
  <div class="form-text mb-2">{{ t('password_hint') }}</div>

  <label class="form-label">{{ t('current_password') }}</label>
  <input name="current_password" type="password" class="form-control mb-3" autocomplete="current-password">

  <button class="btn btn-success mb-3">{{ t('update_account') }}</button>
</form>

<!-- Logout Button -->
<a href="{{ url_for('auth.logout') }}" class="btn btn-danger">
  {{ t('logout') }}
</a>
{% endblock %}
