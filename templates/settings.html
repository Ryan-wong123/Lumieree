{% extends "layout.html" %}
{% block content %}
<h4>{{ t('account_settings') }}</h4>
<form method="POST">
  <label class="form-label">{{ t('email') }}</label>
  <input name="new_email" type="email" class="form-control mb-2" placeholder="{{ t('new_email') }}">

  <label class="form-label">{{ t('password') }}</label>
  <input name="new_password" type="password" class="form-control mb-2" placeholder="{{ t('new_password') }}">

  <button class="btn btn-success">{{ t('update_account') }}</button>
</form>
{% endblock %}
