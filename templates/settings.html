{% extends "layout.html" %}
{% block content %}
<h4>Account Settings</h4>
<form method="POST">
  <label class="form-label">Email</label>
  <input name="new_email" type="email" class="form-control mb-2" placeholder="New Email">

  <label class="form-label">Password</label>
  <input name="new_password" type="password" class="form-control mb-2" placeholder="New Password">

  <button class="btn btn-success">Update Account</button>
</form>
{% endblock %}
