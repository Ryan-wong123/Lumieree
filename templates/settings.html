{% extends "layout.html" %}
{% block content %}
<h4>{{ t('account_settings') }}</h4>
<form method="POST">
  <label class="form-label">{{ t('email') }}</label>
  <input name="new_email" type="text" class="form-control mb-2" placeholder="name or name@gmail.com">

  <label class="form-label">{{ t('password') }}</label>
  <input name="new_password" type="password" class="form-control mb-2" placeholder="{{ t('new_password') }}">

  <button class="btn btn-success mb-3">{{ t('update_account') }}</button>
</form>

<!-- Logout Button -->
<a href="{{ url_for('logout') }}" class="btn btn-danger">
  {{ t('logout') }}
</a>
{% endblock %}
