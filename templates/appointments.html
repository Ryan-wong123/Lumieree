{% extends 'layout.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <div><h4 class="mb-0">Appointment calendar</h4><small class="text-muted">Clinic timezone: {{ timezone }}</small></div>
</div>

<div class="card mb-4"><div class="card-body">
  <h5 id="formTitle">Book an appointment</h5>
  <form method="POST" action="{{ url_for('save_appointments') }}" id="bookingForm" class="row g-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="appointment_id" id="appointmentId">
    <div class="col-md-4"><label class="form-label">Patient</label>
      <select name="patient_id" id="patientId" class="form-select" required {% if not can_book_for_others %}readonly{% endif %}>
        {% for patient in patients %}<option value="{{ patient.id }}">{{ patient.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-4"><label class="form-label">Service</label>
      <select name="service" id="service" class="form-select" required><option value="">Select a service</option>
        {% for service in services %}<option value="{{ service }}">{{ service }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-4"><label class="form-label">Duration</label>
      <select name="duration_minutes" id="duration" class="form-select" required>
        {% for duration in [15, 30, 45, 60, 90, 120] %}<option value="{{ duration }}" {% if duration == 30 %}selected{% endif %}>{{ duration }} minutes</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-4"><label class="form-label">Practitioner</label>
      <select name="practitioner_id" id="practitioner" class="form-select" required><option value="">Select a practitioner</option>
        {% for practitioner in practitioners %}<option value="{{ practitioner.id }}">{{ practitioner.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-4"><label class="form-label">Date</label><input type="date" name="date" id="bookingDate" value="{{ today }}" class="form-control" required></div>
    <div class="col-md-4"><label class="form-label">Available time</label><select name="time" id="bookingTime" class="form-select" required><option value="">Choose practitioner and date</option></select></div>
    {% if not can_book_for_others %}<div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" name="reminder_allowed" id="reminderAllowed"><label class="form-check-label" for="reminderAllowed">I consent to appointment confirmations and reminders.</label></div></div>{% endif %}
    <div class="col-12"><button class="btn btn-success" type="submit">Save appointment</button><button class="btn btn-outline-secondary ms-2 d-none" type="button" id="clearEdit">Stop editing</button></div>
  </form>
</div></div>

<div id="calendar"></div>
<div class="modal fade" id="appointmentModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" id="modalTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="modalBody"></div><div class="modal-footer"><form method="POST" id="cancelForm"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-danger" type="submit" onclick="return confirm('Cancel this appointment?')">Cancel appointment</button></form><button class="btn btn-primary" id="rescheduleButton" data-bs-dismiss="modal">Reschedule</button></div></div></div></div>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/luxon3@6.1.8/index.global.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const practitioner = document.getElementById('practitioner'), date = document.getElementById('bookingDate');
  const duration = document.getElementById('duration'), time = document.getElementById('bookingTime');
  async function loadSlots(preferred='') {
    if (!practitioner.value || !date.value) { time.innerHTML = '<option value="">Choose practitioner and date</option>'; return; }
    time.innerHTML = '<option value="">Loading…</option>';
    const params = new URLSearchParams({practitioner_id: practitioner.value, date: date.value, duration: duration.value});
    const response = await fetch(`/appointments/available-slots?${params}`), data = await response.json();
    if (!response.ok) { time.innerHTML = `<option value="">${data.error || 'Unable to load slots'}</option>`; return; }
    const slots = data.slots || []; if (preferred && !slots.includes(preferred)) slots.unshift(preferred);
    time.innerHTML = slots.length ? slots.map(slot => `<option value="${slot}" ${slot === preferred ? 'selected' : ''}>${slot}</option>`).join('') : '<option value="">No available times</option>';
  }
  [practitioner, date, duration].forEach(el => el.addEventListener('change', () => loadSlots()));
  const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
    initialView: 'timeGridWeek', timeZone: {{ timezone|tojson }}, height: 700,
    headerToolbar: {left: 'prev,next today', center: 'title', right: 'timeGridDay,timeGridWeek'},
    events: '/appointments/events', eventClick(info) {
      const p = info.event.extendedProps;
      document.getElementById('modalTitle').textContent = info.event.title;
      document.getElementById('modalBody').textContent = `${p.local_date} ${p.local_time} ({{ timezone }}), ${p.duration_minutes} minutes`;
      document.getElementById('cancelForm').action = `/appointments/${info.event.id}/cancel`;
      document.getElementById('rescheduleButton').onclick = async () => {
        document.getElementById('appointmentId').value = info.event.id; document.getElementById('patientId').value = p.patient_id;
        practitioner.value = p.practitioner_id; document.getElementById('service').value = p.service; duration.value = p.duration_minutes;
        date.value = p.local_date; document.getElementById('formTitle').textContent = 'Reschedule appointment'; document.getElementById('clearEdit').classList.remove('d-none');
        await loadSlots(p.local_time); document.getElementById('bookingForm').scrollIntoView({behavior:'smooth'});
      };
      new bootstrap.Modal(document.getElementById('appointmentModal')).show();
    }
  }); calendar.render();
  document.getElementById('clearEdit').onclick = () => { document.getElementById('bookingForm').reset(); document.getElementById('appointmentId').value=''; document.getElementById('formTitle').textContent='Book an appointment'; document.getElementById('clearEdit').classList.add('d-none'); loadSlots(); };
});
</script>
{% endblock %}
