{% extends 'layout.html' %}
{% block content %}
<!-- FullCalendar View -->
<div id="calendar"></div>

<!-- Timeslot Form -->
<form method="POST" action="/appointments/save" id="appointmentForm">
  <input type="hidden" name="date" id="selectedDate" value="{{ selected_date }}">

  <table id="appointmentTable" class="table table-bordered table-sm text-center align-middle mt-4">
    <thead class="table-light">
      <tr>
        <th>Patient Name</th>
        {% for hour in range(9, 18) %}
          <th>{{ "%02d:00" % hour }} - {{ "%02d:00" % (hour + 1) }}</th>
        {% endfor %}
      </tr>
    </thead>
    <tbody id="appointmentBody">
      {% for patient in patients %}
      <tr>
        <td><input type="text" class="form-control" name="patient_name_{{ loop.index }}" value="{{ patient.name }}"></td>
        {% for hour in range(9, 18) %}
        <td>
          <input type="text" class="form-control" name="slot_{{ loop.index }}_{{ hour }}"
                 value="{{ appointments.get(patient.name, {}).get(hour|string, '') }}">
        </td>
        {% endfor %}
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <button type="button" class="btn btn-outline-primary" onclick="addRow()">+ Add Patient</button>
  <button type="submit" class="btn btn-success mt-3">Save Appointments</button>
</form>

<!-- FullCalendar JS + CSS -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
    initialView: 'dayGridMonth',
    dateClick: function (info) {
      fetch(`/appointments/json?date=${info.dateStr}`)
        .then(res => res.json())
        .then(data => {
          updateTable(data);
          document.getElementById('selectedDate').value = info.dateStr;
        });
    }
  });
  calendar.render();
});

let rowCount = {{ patients|length }} + 1;

function addRow() {
  const tbody = document.getElementById('appointmentBody');
  let rowHTML = `<tr><td><input type="text" class="form-control" name="patient_name_${rowCount}"></td>`;
  for (let hour = 9; hour < 18; hour++) {
    rowHTML += `<td><input type="text" class="form-control" name="slot_${rowCount}_${hour}"></td>`;
  }
  rowHTML += `</tr>`;
  tbody.insertAdjacentHTML('beforeend', rowHTML);
  rowCount++;
}

function updateTable(data) {
  const tbody = document.getElementById('appointmentBody');
  tbody.innerHTML = '';
  rowCount = 1;

  for (const entry of data.patients) {
    let row = `<tr><td><input type="text" class="form-control" name="patient_name_${rowCount}" value="${entry.name}"></td>`;
    for (let hour = 9; hour < 18; hour++) {
      const value = entry.slots[String(hour)] || '';
      row += `<td><input type="text" class="form-control" name="slot_${rowCount}_${hour}" value="${value}"></td>`;
    }
    row += `</tr>`;
    tbody.insertAdjacentHTML('beforeend', row);
    rowCount++;
  }
}
</script>
{% endblock %}
