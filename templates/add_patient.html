{% extends 'layout.html' %}
{% block content %}
<h4>Add Patient</h4>

<form method="POST">
  <!-- Personal Info -->
  <input name="name" class="form-control mb-2" placeholder="Full Name" required>
  <input name="nric" class="form-control mb-2" placeholder="NRIC / ID" required>
  <input name="dob" type="date" class="form-control mb-2" required>
  <select name="gender" class="form-select mb-2" required>
    <option value="">Select Gender</option>
    <option>Male</option>
    <option>Female</option>
  </select>
  <input name="contact" class="form-control mb-2" placeholder="Contact Number">
  <input name="email" class="form-control mb-2" placeholder="Email">
  <input name="address" class="form-control mb-3" placeholder="Address">

  <h5>Medical Conditions</h5>

  {% for field in ['diabetes', 'hypertension', 'heart_disease', 'asthma', 'stroke', 'kidney_disease'] %}
  <div class="row align-items-center mb-2">
    <div class="col-md-4">
      <label class="form-label mb-0">{{ field.replace('_', ' ').title() }}?</label>
    </div>
    <div class="col-md-8">
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="{{ field }}" id="{{ field }}Yes" value="Yes" required>
        <label class="form-check-label" for="{{ field }}Yes">Yes</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="{{ field }}" id="{{ field }}No" value="No" required>
        <label class="form-check-label" for="{{ field }}No">No</label>
      </div>
    </div>
  </div>
  {% endfor %}

  <div class="mb-3">
    <label class="form-label">Other Conditions</label>
    <textarea name="other_conditions" class="form-control" placeholder="E.g., cancer, thyroid disorder, etc."></textarea>
  </div>

  <button class="btn btn-primary w-100">Add Patient</button>
</form>
{% endblock %}
