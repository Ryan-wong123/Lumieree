{% extends 'layout.html' %}
{% block content %}
<h4>Edit Medicine</h4>

<form method="POST">
  <input name="name" value="{{ medicine.name }}" class="form-control mb-2" placeholder="Name" required>
  <input name="barcode" value="{{ medicine.barcode }}" class="form-control mb-2" placeholder="Barcode" required>
  <input name="type" value="{{ medicine.type }}" class="form-control mb-2" placeholder="Type" required>
  <input name="price" type="number" step="0.01" value="{{ medicine.price }}" class="form-control mb-2" placeholder="Price" required>
  <input name="stock" type="number" value="{{ medicine.stock }}" class="form-control mb-2" placeholder="Stock" required>
  <input name="dosage_info" value="{{ medicine.dosage_info }}" class="form-control mb-2" placeholder="Dosage Info">
  <input type="date" name="expiry_date" value="{{ medicine.expiry_date }}" class="form-control mb-3">
  <input name="batch_number" value="{{ medicine.batch_number or '' }}" class="form-control mb-2" placeholder="Batch Number">

  <button class="btn btn-primary">Save Changes</button>  
</form>

<form method="POST" action="/inventory/delete/{{ medicine.id }}" onsubmit="return confirm('Are you sure you want to delete this medicine? This action cannot be undone.');">
  <button class="btn btn-danger mt-2">🗑️ Delete Medicine</button>
</form>

<a href="/inventory" class="btn btn-secondary mt-2">Cancel</a>
{% endblock %}
