{% extends 'layout.html' %}
{% block content %}
<h4>{{ t('edit_medicine') }}</h4>

<form method="POST">
  <input name="name" value="{{ medicine.name }}" class="form-control mb-2" placeholder="{{ t('medicine_name') }}" required>
  <input name="barcode" value="{{ medicine.barcode }}" class="form-control mb-2" placeholder="{{ t('barcode') }}" required>
  <input name="type" value="{{ medicine.type }}" class="form-control mb-2" placeholder="{{ t('type') }}" required>
  <input name="price" type="number" step="0.01" value="{{ medicine.price }}" class="form-control mb-2" placeholder="{{ t('price') }}" required>
  <input name="stock" type="number" value="{{ medicine.stock }}" class="form-control mb-2" placeholder="{{ t('stock') }}" required>
  <input name="dosage_info" value="{{ medicine.dosage_info }}" class="form-control mb-2" placeholder="{{ t('dosage_info') }}">
  <input type="date" name="expiry_date" value="{{ medicine.expiry_date }}" class="form-control mb-3">
  <input name="batch_number" value="{{ medicine.batch_number or '' }}" class="form-control mb-2" placeholder="{{ t('batch_number') }}">

  <button class="btn btn-primary">{{ t('save_changes') }}</button>  
</form>

<form method="POST" action="/inventory/delete/{{ medicine.id }}" onsubmit="return confirm('{{ t('confirm_delete_medicine') }}');">
  <button class="btn btn-danger mt-2">🗑️ {{ t('delete_medicine') }}</button>
</form>

<a href="/inventory" class="btn btn-secondary mt-2">{{ t('cancel') }}</a>
{% endblock %}
