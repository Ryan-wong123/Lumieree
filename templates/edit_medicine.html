{% extends 'layout.html' %}
{% block content %}

<h4>{{ t('edit_medicine') }}</h4>

<style>
 input[type="date"] {
  text-align: left;
}

input[type="date"]::-webkit-datetime-edit {
  text-align: left;
}
</style>

<form method="POST">

  <!-- Medicine Name -->
  <label class="form-label">{{ t('medicine_name') }}</label>
  <input
    name="name"
    value="{{ medicine.name }}"
    class="form-control mb-3"
    required
  >

  <!-- Price -->
  <label class="form-label">{{ t('price') }}</label>
  <input
    name="price"
    type="number"
    step="0.01"
    value="{{ medicine.price }}"
    class="form-control mb-3"
    required
  >

  <!-- Quantity / Stock -->
  <label class="form-label">{{ t('quantity') }}</label>
  <input
    name="stock"
    type="number"
    value="{{ medicine.stock }}"
    class="form-control mb-3"
    required
  >

  <!-- Expiry Date -->
  <label class="form-label">{{ t('expiry_date') }}</label>
  <input
    type="date"
    name="expiry_date"
    value="{{ (medicine.expiry_date|string)[:10] if medicine.expiry_date else '' }}"
    class="form-control mb-3 text-start"
    required
  >

  <!-- Company -->
  <label class="form-label">{{ t('company') }}</label>
  <input
    name="company"
    value="{{ medicine.company|default('') }}"
    class="form-control mb-3"
    required
  >

  <!-- Medicine Type -->
  <label class="form-label">{{ t('type') }}</label>
  <select name="type" class="form-control mb-4" required>
    {% set cur = (medicine.type|default('')|string|lower) %}
    <option value="" disabled {% if not cur %}selected{% endif %}>
      -- {{ t('select_type') }} --
    </option>
    {% for t in medicine_types %}
      <option value="{{ t }}" {% if t|lower == cur %}selected{% endif %}>
        {{ t }}
      </option>
    {% endfor %}
  </select>

  <button class="btn btn-primary">{{ t('save_changes') }}</button>
</form>

<form
  method="POST"
  action="/inventory/delete/{{ medicine.id }}"
  onsubmit="return confirm('{{ t('confirm_delete_medicine') }}');"
>
  <button class="btn btn-danger mt-2">🗑️ {{ t('delete_medicine') }}</button>
</form>

<a href="/inventory" class="btn btn-secondary mt-2">
  {{ t('cancel') }}
</a>

{% endblock %}
