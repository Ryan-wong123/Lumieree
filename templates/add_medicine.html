{% extends 'layout.html' %}
{% block content %}

<h4>Add Medicine</h4>

<!-- 🔍 Live Scanner Preview -->
<div id="scanner-wrapper" class="d-flex justify-content-center mb-3">
  <div class="text-center">
    <p id="scan-instruction" class="text-muted small mb-2" style="display: none;">
      Point your camera at a barcode
    </p>
    <div id="live-reader"
         class="rounded shadow border"
         style="width: 100%; max-width: 360px; aspect-ratio: 1; display: none;">
    </div>
  </div>
</div>

<!-- 👨‍⚕️ Add Medicine Form -->
<form method="POST">
  <input name="name" class="form-control mb-2" placeholder="Name" required>

  <div class="input-group mb-2">
    <input name="barcode" id="barcode_input" class="form-control" placeholder="Barcode" required>
    <button type="button" class="btn btn-outline-primary" onclick="toggleLiveScanner('barcode_input', null, this)">📷 Scan</button>
  </div>

  <input name="type" class="form-control mb-2" placeholder="Type" required>
  <input name="price" class="form-control mb-2" placeholder="Price" required>
  <input name="stock" class="form-control mb-2" placeholder="Stock" required>
  <input name="dosage_info" class="form-control mb-2" placeholder="Dosage Info">
  <input name="batch_number" class="form-control mb-2" placeholder="Batch Number">
  <input type="date" name="expiry_date" class="form-control mb-3">
  <button class="btn btn-primary">Add Medicine</button>
</form>

<!-- 📜 Scanner Script -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  const html5QrCode = new Html5Qrcode("live-reader");
  const config = { fps: 10, qrbox: { width: 250, height: 250 } };
  let cameraRunning = false;
  let targetInputId = null;
  let autoSubmitFormId = null;
  let activeScanButton = null;

  async function toggleLiveScanner(inputId, formId = null, buttonElement) {
    if (cameraRunning) {
      stopLiveScanner();
      return;
    }

    targetInputId = inputId;
    autoSubmitFormId = formId;
    activeScanButton = buttonElement;

    try {
      const devices = await Html5Qrcode.getCameras();
      if (devices.length) {
        const backCam = devices.find(d => /back|rear|environment/i.test(d.label)) || devices[0];

        document.getElementById("live-reader").style.display = "block";
        document.getElementById("scan-instruction").style.display = "block";
        updateScanButton(true);

        await html5QrCode.start({ deviceId: { exact: backCam.id } }, config, onScanSuccess);
        cameraRunning = true;
      } else {
        alert("No camera found.");
      }
    } catch (err) {
      console.error("Scanner start failed:", err);
      updateScanButton(false);
    }
  }

  async function stopLiveScanner() {
    if (!cameraRunning) return;
    await html5QrCode.stop();
    html5QrCode.clear();
    document.getElementById("live-reader").style.display = "none";
    document.getElementById("scan-instruction").style.display = "none";
    cameraRunning = false;
    updateScanButton(false);
    targetInputId = null;
    autoSubmitFormId = null;
  }

  function updateScanButton(scanning) {
    if (!activeScanButton) return;

    if (scanning) {
      activeScanButton.innerHTML = '<i class="bi bi-stop-circle"></i> Stop Scanning';
      activeScanButton.classList.remove("btn-outline-primary");
      activeScanButton.classList.add("btn-outline-danger");
    } else {
      activeScanButton.innerHTML = '<i class="bi bi-camera"></i> Scan';
      activeScanButton.classList.remove("btn-outline-danger");
      activeScanButton.classList.add("btn-outline-primary");
      activeScanButton = null;
    }
  }

  function onScanSuccess(decodedText, decodedResult) {
    if (targetInputId) {
      const input = document.getElementById(targetInputId);
      if (input) input.value = decodedText;
    }
    stopLiveScanner();

    if (autoSubmitFormId) {
      document.getElementById(autoSubmitFormId).submit();
    }
  }
</script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

{% endblock %}
