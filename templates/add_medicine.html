{% extends 'layout.html' %}
{% block content %}

<h4>{{ t('add_medicine') }}</h4>

<style>
 input[type="date"] {
  text-align: left;
}

input[type="date"]::-webkit-datetime-edit {
  text-align: left;
}
</style>

<form method="POST">

  <label class="form-label">{{ t('medicine_name') }}</label>
  <input name="name" class="form-control mb-2" required>

  <label class="form-label">{{ t('price') }}</label>
  <input name="price" type="number" step="0.01" class="form-control mb-2" required>

  <label class="form-label">{{ t('quantity') }}</label>
  <input name="stock" type="number" class="form-control mb-2" required>

  <label class="form-label">{{ t('expiry_date') }}</label>
  <input type="date" name="expiry_date" class="form-control mb-2 text-start" required>

  <label class="form-label">{{ t('company') }}</label>
  <input name="company" class="form-control mb-2" required>

  <label class="form-label">{{ t('type') }}</label>
  <select name="type" class="form-control mb-3" required>
    <option value="" disabled selected>-- {{ t('select_type') }} --</option>
    <option value="{{ t('pills') }}">{{ t('pills') }}</option>
    <option value="{{ t('grams') }}">{{ t('grams') }}</option>
    <option value="{{ t('bottle') }}">{{ t('bottle') }}</option>
  </select>

  <button class="btn btn-primary">{{ t('add_medicine') }}</button>
</form>

{% endblock %}
