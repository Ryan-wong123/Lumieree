{% extends 'layout.html' %}
{% block content %}

<h4>{{ t('add_medicine') }}</h4>

<form method="POST">
  <input name="name" class="form-control mb-2" placeholder="{{ t('medicine_name') }}" required>
  <input name="price" type="number" step="0.01" class="form-control mb-2" placeholder="{{ t('price') }}" required>
  <input name="stock" type="number" class="form-control mb-2" placeholder="{{ t('quantity') }}" required>
  <input type="date" name="expiry_date" class="form-control mb-3" required>
  <button class="btn btn-primary">{{ t('add_medicine') }}</button>
</form>

{% endblock %}
