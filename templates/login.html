{% extends "layout.html" %}
{% block content %}

<h4>{{ t('login') }}</h4>

<form method="POST">

  <label class="form-label">{{ t('physician_name') }}</label>
  <input name="username" type="text" class="form-control mb-2" required>

  <label class="form-label">{{ t('physician_password') }}</label>
  <input name="password" type="password" class="form-control mb-3" required>

  <button class="btn btn-primary w-100">{{ t('login') }}</button>
</form>

{% endblock %}
