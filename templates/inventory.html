{% extends 'layout.html' %}
{% block content %}

<h4>Inventory Management</h4>

<!-- 🔍 Search Bar with Scan Button -->
<form method="GET" action="/inventory" id="search-form" class="mb-4">
  <div class="input-group">
    <input type="text" name="q" id="search-barcode" class="form-control" placeholder="Search by name or barcode..." value="{{ request.args.get('q', '') }}">
    <button type="button" id="search-scan-btn" class="btn btn-outline-primary" onclick="toggleLiveScanner('search-barcode', 'search-form', this)">
      <i class="bi bi-camera"></i> Scan
    </button>
  </div>
</form>

<!-- 📦 Inventory Table -->
<a href="/inventory/add" class="btn btn-success mb-3">Add Medicine</a>

<table class="table">
  <thead>
    <tr>
      <th>Name</th>
      <th>Type</th>
      <th>Price</th>
      <th>Stock</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for m in medicines %}
    <tr>
      <td>{{ m.name }}</td>
      <td>{{ m.type }}</td>
      <td>{{ m.price }}</td>
      <td id="stock-{{ m.id }}">{{ m.stock }}</td>
      <td>
        <!-- Add 1 Button -->
        <form method="POST" action="/inventory/adjust/{{ m.id }}/increase" class="d-inline">
          <button class="btn btn-sm btn-primary" type="submit">+1</button>
        </form>

        <!-- Manual Stock Update -->
        <form method="POST" action="/inventory/adjust/{{ m.id }}/set" class="d-inline ms-2">
          <input type="number" name="new_stock" min="0" class="form-control d-inline-block" style="width: 80px;" placeholder="Qty" required>
          <button class="btn btn-sm btn-success" type="submit">Save</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr>
      <td colspan="5" class="text-center">No results found.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>

<!-- 🔁 Reusable Scanner Script -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  const html5QrCode = new Html5Qrcode("live-reader");
  const config = { fps: 10, qrbox: { width: 250, height: 250 } };
  let cameraRunning = false;
  let targetInputId = null;
  let autoSubmitFormId = null;
  let activeScanButton = null;

  async function toggleLiveScanner(inputId, formId = null, buttonElement) {
    if (cameraRunning) {
      stopLiveScanner();
      return;
    }

    targetInputId = inputId;
    autoSubmitFormId = formId;
    activeScanButton = buttonElement;

    try {
      const devices = await Html5Qrcode.getCameras();
      if (devices.length) {
        const backCam = devices.find(d => /back|rear|environment/i.test(d.label)) || devices[0];

        document.getElementById("live-reader").style.display = "block";
        document.getElementById("scan-instruction").style.display = "block";
        updateScanButton(true);

        await html5QrCode.start({ deviceId: { exact: backCam.id } }, config, onScanSuccess);
        cameraRunning = true;
      } else {
        alert("No camera found.");
      }
    } catch (err) {
      console.error("Scanner start failed:", err);
      updateScanButton(false);
    }
  }

  async function stopLiveScanner() {
    if (!cameraRunning) return;
    await html5QrCode.stop();
    html5QrCode.clear();
    document.getElementById("live-reader").style.display = "none";
    document.getElementById("scan-instruction").style.display = "none";
    cameraRunning = false;
    updateScanButton(false);
    targetInputId = null;
    autoSubmitFormId = null;
  }

  function updateScanButton(scanning) {
    if (!activeScanButton) return;
    if (scanning) {
      activeScanButton.innerHTML = '<i class="bi bi-stop-circle"></i> Stop Scanning';
      activeScanButton.classList.remove("btn-outline-primary");
      activeScanButton.classList.add("btn-outline-danger");
    } else {
      activeScanButton.innerHTML = '<i class="bi bi-camera"></i> Scan';
      activeScanButton.classList.remove("btn-outline-danger");
      activeScanButton.classList.add("btn-outline-primary");
      activeScanButton = null;
    }
  }

  function onScanSuccess(decodedText, decodedResult) {
    if (targetInputId) {
      const input = document.getElementById(targetInputId);
      if (input) input.value = decodedText;
    }
    stopLiveScanner();
    if (autoSubmitFormId) {
      document.getElementById(autoSubmitFormId).submit();
    }
  }
</script>

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

{% endblock %}
