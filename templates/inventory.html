{% extends 'layout.html' %}
{% block content %}
<h4>Inventory</h4>

<!-- Barcode Entry + Quantity Selection -->
<h5>Lookup / Add by Barcode</h5>
<form method="POST" action="/inventory/scan-combined" enctype="multipart/form-data" class="row g-3 mb-4 align-items-end">
  <!-- Manual Barcode -->
  <div class="col-md-6">
    <label for="manual_barcode" class="form-label">Enter Barcode Manually or Use Scanned</label>
    <input type="text" name="manual_barcode" id="manual_barcode" class="form-control" placeholder="e.g. 0123456789">
  </div>

  <!-- Barcode Image Upload -->
  <div class="col-md-6">
    <label for="barcode_image" class="form-label">Upload Barcode Image</label>
    <input type="file" id="barcode_image" name="barcode_image" accept="image/*" capture="environment" class="form-control">
  </div>

  <!-- Quantity Input with Quick Select -->
  <div class="col-md-6">
    <label for="increase_amount" class="form-label">Quantity to Increase</label>
    <div class="input-group">
      <input type="number" name="increase_amount" id="increase_amount" class="form-control" value="1" min="1" required>
      <select class="form-select" onchange="document.getElementById('increase_amount').value = this.value;">
        <option value="">Quick Select</option>
        <option value="1">+1</option>
        <option value="5">+5</option>
        <option value="10">+10</option>
      </select>
    </div>
  </div>

  <!-- Live Preview of Scanned Barcode -->
  <div class="col-md-6">
    <p id="preview-barcode" class="text-info mt-4 mb-0" style="display: none;">
      <strong>Detected Barcode:</strong> <span id="barcode-value"></span>
    </p>
  </div>

  <!-- Submit Button -->
  <div class="col-12">
    <button type="submit" class="btn btn-primary w-100">Submit</button>
  </div>
</form>

<hr>

<!-- Medicine Inventory Table -->
<a href="/inventory/add" class="btn btn-success mb-3">Add Medicine</a>
<table class="table">
  <thead>
    <tr>
      <th>Name</th><th>Type</th><th>Price</th><th>Stock</th><th>Expiry</th>
    </tr>
  </thead>
  <tbody>
    {% for m in medicines %}
    <tr>
      <td>{{ m.name }}</td>
      <td>{{ m.type }}</td>
      <td>{{ m.price }}</td>
      <td>{{ m.stock }}</td>
      <td>{{ m.expiry_date }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>

<!-- Barcode JS Preview (optional and basic) -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  document.getElementById('barcode_image').addEventListener('change', function(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        Html5Qrcode.createBarcodeDecoder().decode(canvas)
          .then(decodedText => {
            document.getElementById('manual_barcode').value = decodedText;
            document.getElementById('barcode-value').textContent = decodedText;
            document.getElementById('preview-barcode').style.display = 'block';
          })
          .catch(err => {
            document.getElementById('preview-barcode').style.display = 'none';
            console.warn("No barcode detected in image:", err);
          });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
</script>
{% endblock %}
