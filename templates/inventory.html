{% extends 'layout.html' %}
{% block content %}
<h4>Inventory</h4>

<!-- 📸 Live Camera Scanner -->
<div class="mb-3">
  <button type="button" class="btn btn-outline-primary" onclick="startLiveScanner()">📷 Start Live Scan</button>
  <button type="button" class="btn btn-outline-secondary" onclick="stopLiveScanner()" id="stop-btn" disabled>🛑 Stop Scan</button>
</div>
<div id="live-reader" style="width: 300px; display: none;"></div>

<!-- 🧾 Barcode + Quantity Form -->
<h5>Lookup / Add by Barcode</h5>
<form method="POST" action="/inventory/scan-combined" enctype="multipart/form-data" class="row g-3 mb-4 align-items-end">
  <!-- Manual Barcode Input -->
  <div class="col-md-6">
    <label for="manual_barcode" class="form-label">Enter Barcode Manually or Use Scanned</label>
    <input type="text" name="manual_barcode" id="manual_barcode" class="form-control" placeholder="e.g. 0123456789">
  </div>

  <!-- Image Upload -->
  <div class="col-md-6">
    <label for="barcode_image" class="form-label">Upload Barcode Image</label>
    <input type="file" id="barcode_image" name="barcode_image" accept="image/*" capture="environment" class="form-control">
  </div>

  <!-- Quantity with Quick Select -->
  <div class="col-md-6">
    <label for="increase_amount" class="form-label">Quantity to Increase</label>
    <div class="input-group">
      <input type="number" name="increase_amount" id="increase_amount" class="form-control" value="1" min="1" required>
      <select class="form-select" onchange="document.getElementById('increase_amount').value = this.value;">
        <option value="">Quick Select</option>
        <option value="1">+1</option>
        <option value="5">+5</option>
        <option value="10">+10</option>
      </select>
    </div>
  </div>

  <!-- Preview of Detected Barcode -->
  <div class="col-md-6">
    <p id="preview-barcode" class="text-info mt-4 mb-0" style="display: none;">
      <strong>Detected Barcode:</strong> <span id="barcode-value"></span>
    </p>
  </div>

  <!-- Submit Button -->
  <div class="col-12">
    <button type="submit" class="btn btn-primary w-100">Submit</button>
  </div>
</form>

<hr>

<!-- 📦 Inventory Table -->
<a href="/inventory/add" class="btn btn-success mb-3">Add Medicine</a>
<table class="table">
  <thead>
    <tr>
      <th>Name</th><th>Type</th><th>Price</th><th>Stock</th><th>Expiry</th>
    </tr>
  </thead>
  <tbody>
    {% for m in medicines %}
    <tr>
      <td>{{ m.name }}</td>
      <td>{{ m.type }}</td>
      <td>{{ m.price }}</td>
      <td>{{ m.stock }}</td>
      <td>{{ m.expiry_date }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>

<!-- 📜 Live Scanner Script -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  const html5QrCode = new Html5Qrcode("live-reader");
  const config = { fps: 10, qrbox: { width: 250, height: 250 } };
  let cameraRunning = false;

  function onScanSuccess(decodedText, decodedResult) {
    document.getElementById('manual_barcode').value = decodedText;
    document.getElementById('barcode-value').textContent = decodedText;
    document.getElementById('preview-barcode').style.display = 'block';
    stopLiveScanner(); // Optional: stop scanning after one successful read
  }

  async function startLiveScanner() {
    if (cameraRunning) return;

    try {
      const devices = await Html5Qrcode.getCameras();
      if (devices.length) {
        document.getElementById("live-reader").style.display = "block";
        await html5QrCode.start(devices[0].id, config, onScanSuccess);
        cameraRunning = true;
        document.getElementById("stop-btn").disabled = false;
      } else {
        alert("No camera found.");
      }
    } catch (err) {
      console.error("Error starting scanner:", err);
    }
  }

  async function stopLiveScanner() {
    if (!cameraRunning) return;

    await html5QrCode.stop();
    html5QrCode.clear();
    document.getElementById("live-reader").style.display = "none";
    cameraRunning = false;
    document.getElementById("stop-btn").disabled = true;
  }
</script>
{% endblock %}
