{% extends 'layout.html' %}
{% block content %}
<h4>Inventory</h4>

<!-- Barcode Entry + Live Preview -->
<h5>Lookup / Add by Barcode</h5>
<form method="POST" action="/inventory/scan-combined" enctype="multipart/form-data" class="row g-2 mb-3 align-items-end">
  <div class="col-md-6">
    <label for="manual_barcode" class="form-label">Enter Barcode Manually or Use Scanned</label>
    <input type="text" name="manual_barcode" id="manual_barcode" class="form-control" placeholder="e.g. 0123456789" >
  </div>
  <div class="col-md-6">
    <label for="barcode_image" class="form-label">Upload Barcode Image</label>
    <input type="file" id="barcode_image" name="barcode_image" accept="image/*" capture="environment" class="form-control">
  </div>

  <div class="col-12">
    <p id="preview-barcode" class="text-info mt-1" style="display: none;">
      <strong>Detected Barcode:</strong> <span id="barcode-value"></span>
    </p>
    <button type="submit" class="btn btn-primary w-100">Submit</button>
  </div>
</form>

<hr>

<!-- Medicine Table -->
<a href="/inventory/add" class="btn btn-success mb-3">Add Medicine</a>
<table class="table">
  <thead>
    <tr>
      <th>Name</th><th>Type</th><th>Price</th><th>Stock</th><th>Expiry</th>
    </tr>
  </thead>
  <tbody>
    {% for m in medicines %}
    <tr>
      <td>{{ m.name }}</td>
      <td>{{ m.type }}</td>
      <td>{{ m.price }}</td>
      <td>{{ m.stock }}</td>
      <td>{{ m.expiry_date }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>

<!-- JS Barcode Reader -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  document.getElementById('barcode_image').addEventListener('change', function(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

        const codeReader = new ZXing.BrowserBarcodeReader();
        codeReader.decodeFromImageElement(img).then(result => {
          const decodedText = result.text;
          document.getElementById('manual_barcode').value = decodedText;
          document.getElementById('barcode-value').textContent = decodedText;
          document.getElementById('preview-barcode').style.display = 'block';
        }).catch(err => {
          document.getElementById('preview-barcode').style.display = 'none';
          console.warn("No barcode found in image.", err);
        });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
</script>
{% endblock %}
