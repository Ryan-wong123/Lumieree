{% extends 'layout.html' %}
{% block content %}
<h4>Inventory</h4>

<!-- Manual and Camera-Based Barcode Input -->
<h5>Lookup / Add by Barcode</h5>
<form method="POST" action="/inventory/scan" id="barcode-form" class="row g-2 mb-3 align-items-center">
  <div class="col-auto">
    <input type="text" name="barcode" id="barcode-input" class="form-control" placeholder="Enter barcode manually" required>
  </div>
  <div class="col-auto">
    <button type="submit" class="btn btn-success">Submit Manually</button>
  </div>
</form>

<form method="POST" action="/inventory/scan-image" enctype="multipart/form-data" class="row g-2 mb-3 align-items-center">
  <div class="col-auto">
    <input type="file" name="barcode_image" accept="image/*" capture="environment" class="form-control" required>
  </div>
  <div class="col-auto">
    <button type="submit" class="btn btn-primary">📷 Upload Barcode Image</button>
  </div>
</form>

<hr>

<!-- Medicine Table -->
<a href="/inventory/add" class="btn btn-success mb-3">Add Medicine</a>
<table class="table">
  <thead>
    <tr>
      <th>Name</th><th>Type</th><th>Price</th><th>Stock</th><th>Expiry</th>
    </tr>
  </thead>
  <tbody>
    {% for m in medicines %}
    <tr>
      <td>{{ m.name }}</td>
      <td>{{ m.type }}</td>
      <td>{{ m.price }}</td>
      <td>{{ m.stock }}</td>
      <td>{{ m.expiry_date }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
