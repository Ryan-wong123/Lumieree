<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>TCM POS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
  <!-- ✅ Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">TCM POS</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link {% if request.path.startswith('/appointments') %}active{% endif %}"
              href="/appointments">Appointment</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path.startswith('/patients') %}active{% endif %}"
              href="/patients">Patients</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path.startswith('/inventory') %}active{% endif %}"
              href="/inventory">Inventory</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path.startswith('/front_desk') %}active{% endif %}"
              href="/front_desk">Front Desk</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path.startswith('/inventory') %}active{% endif %}"
              href="/admin/dashboard">Admin</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path.startswith('/settings') %}active{% endif %}"
              href="/settings">Settings</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container">
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="alert alert-info">{{ messages[0] }}</div>
    {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
