{% extends 'layout.html' %}
{% block content %}
<h4>Edit Patient</h4>

<form method="POST">
  <!-- Personal Info -->
  <input name="name" class="form-control mb-2" placeholder="Full Name" value="{{ patient.name }}" required>
  <input name="nric" class="form-control mb-2" placeholder="NRIC / ID" value="{{ patient.nric }}" required>
  <input name="dob" type="date" class="form-control mb-2" value="{{ patient.dob }}" required>
  <select name="gender" class="form-select mb-2" required>
    <option value="">Select Gender</option>
    <option {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
    <option {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
  </select>
  <input name="contact" class="form-control mb-2" placeholder="Contact Number" value="{{ patient.contact }}">
  <input name="email" class="form-control mb-2" value="{{ patient.email }}">
  <input name="address" class="form-control mb-3" value="{{ patient.address }}">

  <h5>Medical Conditions</h5>

  {% for field in ['diabetes', 'hypertension', 'heart_disease', 'asthma', 'stroke', 'kidney_disease'] %}
  <div class="row align-items-center mb-2">
    <div class="col-md-4">
      <label class="form-label mb-0">{{ field.replace('_', ' ').title() }}?</label>
    </div>
    <div class="col-md-8">
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="{{ field }}" id="{{ field }}Yes" value="Yes" {% if patient[field] == 'Yes' %}checked{% endif %} required>
        <label class="form-check-label" for="{{ field }}Yes">Yes</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="{{ field }}" id="{{ field }}No" value="No" {% if patient[field] == 'No' %}checked{% endif %} required>
        <label class="form-check-label" for="{{ field }}No">No</label>
      </div>
    </div>
  </div>
  {% endfor %}

  <div class="mb-3">
    <label class="form-label">Other Conditions</label>
    <textarea name="other_conditions" class="form-control">{{ patient.other_conditions }}</textarea>
  </div>

  <div class="d-flex justify-content-between">
    <button type="submit" class="btn btn-primary">Save Changes</button>
  </div>
</form>

<form action="{{ url_for('delete_patient', id=patient.id) }}" method="POST" onsubmit="return confirm('Are you sure you want to delete this patient?')" class="mt-3">
  <button type="submit" class="btn btn-outline-danger w-100">Delete Patient</button>
</form>
{% endblock %}
