{% extends 'layout.html' %}
{% block content %}

<h4>{{ t('edit_patient') }}</h4>

<style>
 input[type="date"] {
  text-align: left;
}

input[type="date"]::-webkit-datetime-edit {
  text-align: left;
}
</style>

<form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <!-- Personal Info -->
  <label class="form-label">{{ t('full_name') }}</label>
  <input name="name" class="form-control mb-2" value="{{ patient.name }}" required>

  <label class="form-label">{{ t('nric') }}</label>
  <input name="nric" class="form-control mb-2" value="{{ patient.nric }}" required>

  <label class="form-label">{{ t('dob') }}</label>
  <input name="dob" type="date" class="form-control mb-2 text-start" value="{{ patient.dob }}" required>

  <label class="form-label">{{ t('gender') }}</label>
  <select name="gender" class="form-select mb-2" required>
    <option value="" disabled>-- {{ t('select_gender') }} --</option>
    <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>{{ t('male') }}</option>
    <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>{{ t('female') }}</option>
  </select>

  <label class="form-label">{{ t('contact') }}</label>
  <input name="contact" class="form-control mb-2" value="{{ patient.contact }}">

  <label class="form-label">{{ t('email') }}</label>
  <input name="email" class="form-control mb-2" value="{{ patient.email }}">

  <label class="form-label">{{ t('address') }}</label>
  <input name="address" class="form-control mb-3" value="{{ patient.address }}">

  <h5 class="mt-3">{{ t('medical_conditions') }}</h5>

  {% for field in ['diabetes', 'hypertension', 'heart_disease', 'asthma', 'stroke', 'kidney_disease', 'High Cholesterol'] %}
  <div class="row align-items-center mb-2">
    <div class="col-md-4">
      <label class="form-label mb-0">{{ t(field) }}</label>
    </div>
    <div class="col-md-8">
      <div class="form-check form-check-inline">
        <input class="form-check-input"
               type="radio"
               name="{{ field }}"
               id="{{ field }}Yes"
               value="Yes"
               {% if patient[field] == 'Yes' %}checked{% endif %}
               required>
        <label class="form-check-label" for="{{ field }}Yes">{{ t('yes') }}</label>
      </div>

      <div class="form-check form-check-inline">
        <input class="form-check-input"
               type="radio"
               name="{{ field }}"
               id="{{ field }}No"
               value="No"
               {% if patient[field] == 'No' %}checked{% endif %}
               required>
        <label class="form-check-label" for="{{ field }}No">{{ t('no') }}</label>
      </div>
    </div>
  </div>
  {% endfor %}

  <!-- Taking Western Medicine -->
  <div class="row align-items-center mb-2">
    <div class="col-md-4">
      <label class="form-label mb-0">{{ t('taking_western_medicine') }}</label>
    </div>
    <div class="col-md-8">
      <div class="form-check form-check-inline">
        <input class="form-check-input"
               type="radio"
               name="taking_western_medicine"
               id="westernYes"
               value="Yes"
               {% if patient.taking_western_medicine == 'Yes' %}checked{% endif %}
               required>
        <label class="form-check-label" for="westernYes">{{ t('yes') }}</label>
      </div>

      <div class="form-check form-check-inline">
        <input class="form-check-input"
               type="radio"
               name="taking_western_medicine"
               id="westernNo"
               value="No"
               {% if patient.taking_western_medicine == 'No' or not patient.taking_western_medicine %}checked{% endif %}
               required>
        <label class="form-check-label" for="westernNo">{{ t('no') }}</label>
      </div>
    </div>
  </div>

  <!-- Duration (shown only if Yes) -->
  <div class="mb-3" id="westernDurationGroup" style="display:none;">
    <label class="form-label" for="westernDurationInput">
      {{ t('western_medicine_duration') }}
    </label>
    <input
      type="text"
      id="westernDurationInput"
      name="western_medicine_duration"
      class="form-control"
      value="{{ patient.western_medicine_duration }}">
  </div>

  <!-- Other Conditions -->
  <div class="mb-3">
    <label class="form-label">{{ t('other_conditions') }}</label>
    <textarea name="other_conditions" class="form-control">{{ patient.other_conditions }}</textarea>
  </div>

  <!-- Drug Allergies -->
  <div class="mb-3">
    <label class="form-label">{{ t('drug_allergies') }}</label>
    <textarea name="drug_allergies" class="form-control">{{ patient.drug_allergies }}</textarea>
  </div>

  <button type="submit" class="btn btn-primary w-100">
    {{ t('save_changes') }}
  </button>
</form>

<form action="{{ url_for('patients.delete_patient', patient_id=patient.id) }}"
      method="POST"
      data-confirm="{{ t('confirm_delete_patient') }}"
      class="mt-3">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button type="submit" class="btn btn-outline-danger w-100">
    {{ t('delete_patient') }}
  </button>
</form>

<script nonce="{{ csp_nonce }}">
  document.addEventListener('DOMContentLoaded', function () {
    const yesRadio = document.getElementById('westernYes');
    const noRadio  = document.getElementById('westernNo');
    const group    = document.getElementById('westernDurationGroup');
    const input    = document.getElementById('westernDurationInput');

    function toggleDuration() {
      const show = yesRadio.checked;
      group.style.display = show ? 'block' : 'none';
      if (show) {
        input.setAttribute('required', 'required');
      } else {
        input.removeAttribute('required');
      }
    }

    yesRadio.addEventListener('change', toggleDuration);
    noRadio.addEventListener('change', toggleDuration);
    toggleDuration();
  });
</script>

{% endblock %}
