{% extends "layout.html" %}
{% block content %}

<h3>{{ t('edit_user') }}</h3>

<div class="mb-3">
  <div><strong>UID:</strong> {{ u.uid }}</div>
  <div><strong>{{ t('email') }}:</strong> {{ u.email or "N/A" }}</div>
</div>

<form method="POST" style="max-width:520px;">
  <div class="mb-3">
    <label class="form-label">{{ t('role') }}</label>
    <select class="form-select" name="role">
      <option value="{{ t('staff') }}" {% if u.role == "{{ t('staff') }}" %}selected{% endif %}>{{ t('staff') }}</option>
      <option value="{{ t('admin') }}" {% if u.role == "{{ t('admin') }}" %}selected{% endif %}>{{ t('admin') }}</option>
      <option value="{{ t('super_admin') }}" {% if u.role == "{{ t('super_admin') }}" %}selected{% endif %}>{{ t('super_admin') }}</option>
    </select>
  </div>

  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="active" id="active"
           {% if u.active %}checked{% endif %}>
    <label class="form-check-label" for="active">{{ t('active') }}</label>
  </div>

  <hr>

  <div class="mb-3">
    <label class="form-label">{{ t('change_email') }}</label>
    <input class="form-control" name="new_email" placeholder="newemail@example.com">
  </div>

  <div class="mb-3">
    <label class="form-label">{{ t('change_password') }}</label>
    <input class="form-control" name="new_password" type="password" placeholder="New password">
  </div>

  <button class="btn btn-success">{{ t('save_changes') }}</button>
  <a class="btn btn-secondary" href="{{ url_for('admin_users') }}">{{ t('back') }}</a>
</form>

{% endblock %}
