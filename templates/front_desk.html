{% extends 'layout.html' %}
{% block content %}
<h4>Front Desk Queue</h4>
{% for item in queue %}
  <div class="card mb-3">
    <div class="card-body">
      <h5>{{ item.patient_name }}</h5>
      <p>Status: {{ item.status }}</p>
      <ul>
        {% for i in item["items"] %}
          <li>{{ i.quantity }}x {{ i.name }}</li>
        {% endfor %}
      </ul>
      <a href="/front_desk/update/{{ item.id }}/prepared" class="btn btn-warning btn-sm">Mark Prepared</a>
      <a href="/front_desk/update/{{ item.id }}/completed" class="btn btn-success btn-sm">Mark Completed</a>
    </div>
  </div>
{% endfor %}
{% endblock %}
