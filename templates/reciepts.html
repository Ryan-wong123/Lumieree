{% extends 'layout.html' %}
{% block content %}
<h4>Receipt for {{ patient.name }}</h4>

<table class="table table-bordered">
  <thead>
    <tr><th>Medicine</th><th>Unit Price</th><th>Qty</th><th>Subtotal</th></tr>
  </thead>
  <tbody>
    {% for i in items %}
    <tr>
      <td>{{ i.name }}</td>
      <td>${{ i.unit_price }}</td>
      <td>{{ i.quantity }}</td>
      <td>${{ i.subtotal }}</td>
    </tr>
    {% endfor %}
  </tbody>
  <tfoot>
    <tr>
      <th colspan="3" class="text-end">Total</th>
      <th>${{ total }}</th>
    </tr>
  </tfoot>
</table>

<a href="/front_desk" class="btn btn-secondary mt-3">Back to Queue</a>
{% endblock %}
