{% extends "layout.html" %}
{% block content %}

<h4>{{ t('mfa_login_title') }}</h4>
<p class="text-muted">{{ t('mfa_login_hint') }}</p>

<form method="POST" style="max-width:420px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label class="form-label" for="code">{{ t('mfa_code') }}</label>
  <input id="code" name="code" type="text" class="form-control mb-3" inputmode="numeric" autocomplete="one-time-code"
    maxlength="32" autofocus required>

  <button class="btn btn-primary w-100">{{ t('mfa_verify') }}</button>
</form>

<p class="mt-3"><a href="{{ url_for('auth.login') }}">{{ t('back') }}</a></p>

{% endblock %}
