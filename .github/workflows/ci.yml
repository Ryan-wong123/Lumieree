name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: lumieree
          POSTGRES_PASSWORD: lumieree
          POSTGRES_DB: lumieree_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lumieree" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://lumieree:lumieree@localhost:5432/lumieree_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Migrations apply cleanly and match the models
        env:
          APP_ENV: development
          DATABASE_URL: postgresql+psycopg://lumieree:lumieree@localhost:5432/lumieree_test
          FLASK_APP: wsgi.py
        run: |
          flask db upgrade
          flask db check
          flask db downgrade base
          flask db upgrade

  docs-in-sync:
    # AGENTS.md rule: code changes must come with PRD.md / architecture.md updates.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require docs updates for product/architecture changes
        run: python scripts/check_docs_updated.py "origin/${{ github.base_ref }}"

  trivy-fs:
    # Dependency vulnerabilities (requirements*.txt), committed secrets, and Dockerfile / Kubernetes misconfigurations.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lower-case the image owner (registry names must be lowercase)
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: lumieree:scan
          cache-from: type=gha
      - name: Scan image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lumieree:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/lumieree:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/lumieree:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Continuous deployment: every commit that lands on main and passes tests, scans and the image build is deployed
    # to production. The job asks AWS Systems Manager to run the `lumieree-deploy` document (a fixed command whose
    # only input is this commit's SHA); the server then migrates, rolls out, smoke-tests and rolls back on failure.
    # AWS access uses GitHub's OIDC identity (no stored keys); the IAM role trusts only the main branch of this repo.
    needs: [test, trivy-fs, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false   # never abort a deploy half way; later commits queue up
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      INSTANCE_ID: i-0023c4e58b28c1430
      SITE: https://lumieree.duckdns.org
    steps:
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: arn:aws:iam::388033185694:role/lumieree-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy ${{ github.sha }}
        run: |
          set -euo pipefail
          CID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name lumieree-deploy \
            --parameters "tag=${GITHUB_SHA}" --comment "deploy ${GITHUB_SHA::12}" \
            --query Command.CommandId --output text)
          echo "SSM command $CID"
          STATUS=Pending
          for _ in $(seq 1 130); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done
          OUT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true)
          ERR=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true)
          echo "$OUT"
          [ -z "$ERR" ] || { echo "--- stderr ---"; echo "$ERR"; }
          { echo "### Deploy ${GITHUB_SHA::12}: $STATUS"; echo '```'; echo "$OUT" | tail -25; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$STATUS" = "Success" ]
      - name: Smoke test the public site
        run: |
          set -euo pipefail
          ok=""
          for _ in $(seq 1 12); do
            if curl -fsS --max-time 10 "$SITE/readyz" | grep -q '"ready"'; then ok=1; break; fi
            sleep 5
          done
          [ -n "$ok" ] || { echo "/readyz is not ready"; exit 1; }
          curl -fsS --max-time 10 "$SITE/healthz" | grep -q '"ok"'
          # HTTP must redirect to HTTPS, and pages must carry the nonce-based CSP.
          [ "$(curl -s -o /dev/null -w '%{http_code}' "http://${SITE#https://}/")" = "308" ]
          curl -sI --max-time 10 "$SITE/login" | grep -i '^content-security-policy:' | grep -q "'nonce-"
          echo "Production is healthy at $SITE"
