name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lumieree
          POSTGRES_PASSWORD: lumieree
          POSTGRES_DB: lumieree_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lumieree" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://lumieree:lumieree@localhost:5432/lumieree_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Migrations apply cleanly and match the models
        env:
          APP_ENV: development
          DATABASE_URL: postgresql+psycopg://lumieree:lumieree@localhost:5432/lumieree_test
          FLASK_APP: wsgi.py
        run: |
          flask db upgrade
          flask db check
          flask db downgrade base
          flask db upgrade

  docs-in-sync:
    # AGENTS.md rule: code changes must come with PRD.md / architecture.md updates.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require docs updates for product/architecture changes
        run: python scripts/check_docs_updated.py "origin/${{ github.base_ref }}"

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lower-case the image owner (registry names must be lowercase)
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/lumieree:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/lumieree:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
